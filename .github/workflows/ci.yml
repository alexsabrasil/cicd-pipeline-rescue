name: CI - TechExpress

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Build, Tests and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build validation
        run: npm run build

      - name: Unit tests and Quality Gate
        run: npm run test:unit

      - name: Static analysis with ESLint
        run: npm run lint

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t techexpress-api:ci .

  staging-e2e:
    name: Staging and E2E Tests
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Docker image for staging
        run: docker build -t techexpress-api:staging .

      - name: Deploy to staging
        run: |
          docker run -d \
            --name techexpress-staging \
            -p 3001:3000 \
            techexpress-api:staging

      - name: Wait for staging health check
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:3001/health; then
              echo "Staging está disponível."
              exit 0
            fi

            echo "Aguardando staging..."
            sleep 2
          done

          echo "Staging não ficou disponível."
          docker logs techexpress-staging
          exit 1

      - name: Run E2E tests against staging
        run: npm run test:e2e

      - name: Show staging container
        if: always()
        run: docker ps -a

      - name: Cleanup staging
        if: always()
        run: docker rm -f techexpress-staging || true

  production:
    name: Production Approval and Deploy
    runs-on: ubuntu-latest
    needs: staging-e2e
    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm QA approval
        run: |
          echo "Aprovação manual do QA recebida."
          echo "Deploy em Produção autorizado."

      - name: Simulate production deploy
        run: |
          echo "Simulação de Deploy em Produção iniciada."
          echo "TechExpress pronta para implantação em Produção."
